# Txt2Fly (docs/06): the aircraft waits over the airstrip, circling home, for a plan.
schema_version: 1
id: txt2fly-demo
description: >-
  Txt2Fly: circles over the Wrenfold airstrip until a plan is confirmed. The site's operations block sets
  the geofence, the no-fly areas and the places plans can name.
site: wrenfold_vale
airframe: aerosonde_bm
seed: 2026
duration_s: 1800
initial: {pos_ne_m: [0, 0], alt_agl_m: 100, heading_deg: 0, airspeed_mps: 25}
mission:
  alt_agl_m: 100
  waypoints_ne_m: [[100, 50]]
  on_complete: rtl
  home_ne_m: [0, 0]
environment:
  wind: {from_deg: 250, speed_mps: 6}
  turbulence: {model: dryden_low_alt, intensity: light}
stack: {autopilot: stock, contingency: classical_v0, estimator: navigator}
