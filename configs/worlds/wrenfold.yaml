# Wrenfold Vale (docs/07): a synthetic English valley, 3.2 km square, known exactly.
# The River Wren meanders east along the valley floor between a wooded north ridge (+30 m) and
# a higher south ridge (+40 m). Wrenfold village sits on a terrace north of the river, with
# its church, pub and green; two farms, a radio mast, an airstrip and a patchwork of hedged
# fields fill the rest. Everything below is authored; the generator (seed) adds the fields,
# hedges, trees and village houses deterministically. The ground at home (the airstrip) is
# the site datum: every height is above it.
schema_version: 1
id: wrenfold
name: Wrenfold Vale
description: >-
  Synthetic valley: river, village with church, two farms, woods, hedged fields, an airstrip
  and a radio mast. Terrain from 3 m below the airstrip (the river) to about 40 m above it.
seed: 20261022
bounds_ne_m: [[-1600, -1600], [1600, 1600]]

terrain:
  cell_m: 10
  east_slope_per_km: -1.5
  ridges:
    - {from_n_m: 380, to_n_m: 1350, rise_m: 30}
    - {from_n_m: -700, to_n_m: -1450, rise_m: 40}
  hills:
    - {centre_ne_m: [1150, 1000], height_m: 8, radius_m: 300}
    - {centre_ne_m: [-1200, -800], height_m: 6, radius_m: 350}
    - {centre_ne_m: [600, 1300], height_m: 5, radius_m: 250}
  noise_m: 1.2

