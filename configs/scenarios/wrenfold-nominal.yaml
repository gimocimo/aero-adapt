# Wrenfold Vale (docs/07): a circuit of the valley, no faults. The live server's default, so
# faults can be injected from Skyview over a world the simulator knows exactly.
schema_version: 1
id: wrenfold-nominal
description: >-
  Wrenfold Vale: a circuit of the valley at 110 m (above the airstrip), round the village and
  over the fields. Inject a fault from the panel to see the stack cope.
site: wrenfold_vale
airframe: aerosonde_bm
seed: 3000
duration_s: 1800
initial: {pos_ne_m: [0, 0], alt_agl_m: 110, heading_deg: 90, airspeed_mps: 25}
mission:
  alt_agl_m: 110
  waypoints_ne_m: [[0, 1100], [-600, 1100], [-650, -900], [100, -1200]]
  on_complete: loop
environment:
  wind: {from_deg: 250, speed_mps: 6}
  turbulence: {model: dryden_low_alt, intensity: light}
stack: {autopilot: stock, contingency: classical_v0, estimator: navigator}
