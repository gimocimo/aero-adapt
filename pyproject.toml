[project]
name = "aeroadapt"
version = "0.1.0"
description = "AeroAdapt-UAV: an adaptive, fault-aware autonomous pilot for fixed-wing UAVs (simulation-first)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "gimocimo" }]
dependencies = [
    "jax>=0.4.35",
    "numpy>=2.0",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "shapely>=2.0",
]

[project.scripts]
aeroadapt = "aeroadapt.cli:main"

[project.optional-dependencies]
jsbsim = [
    "jsbsim>=1.2",
]
generator = [
    "aerosandbox>=4.2",
    "neuralfoil>=0.3",
    "trimesh>=4.4",
]
live = [
    "msgpack>=1.0",
    "websockets>=13",
]
txt2fly = [
    "anthropic>=2.1,<3",
]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "matplotlib>=3.9",
    "pre-commit>=3.8",
    "pygeomag>=1.1.0",
    "pymap3d>=3.1",
    "pyright>=1.1.380",
    "pytest>=8.3",
    "ruff>=0.7",
    "trimesh>=4.4",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeroadapt"]

# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "reference", "tools", "validation"]
extend-exclude = ["web", "docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
# RUF001-003: Greek letters and math symbols in docstrings/comments are deliberate (α, β, ω, ×).
# SIM300: false positive on the idiomatic `value == pytest.approx(expected)`.
ignore = ["RUF001", "RUF002", "RUF003", "SIM300"]

[tool.ruff.lint.per-file-ignores]
# Report tables: one row per line reads better than wrapped f-strings.
"validation/report.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["aeroadapt", "reference"]

# ---------------------------------------------------------------------------
[tool.pyright]
include = ["src", "tests", "reference", "tools", "validation"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Strict mode is enabled per file (``# pyright: strict``) where the dependencies are fully
# typed. JAX's own stubs contain unknown types, so JAX modules use standard mode (ADR-002).

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -ra"
markers = [
    "full: slow validation tier, run nightly and before tagging a milestone",
]
