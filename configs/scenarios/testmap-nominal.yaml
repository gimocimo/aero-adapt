# The test map, step 1: a 3 km square circuit at 120 m above home, over the plain and across
# the eastern hills. No faults.
schema_version: 1
id: testmap-nominal
description: >-
  Test map: a 3 km square circuit at 120 m above home, over the plain and the eastern hills.
site: testmap
airframe: aerosonde_bm
seed: 5000
duration_s: 1800
initial: {pos_ne_m: [0, 0], alt_agl_m: 120, heading_deg: 0, airspeed_mps: 25}
mission:
  alt_agl_m: 120
  waypoints_ne_m: [[1500, -1500], [1500, 1500], [-1500, 1500], [-1500, -1500]]
  on_complete: loop
environment:
  wind: {from_deg: 250, speed_mps: 5}
  turbulence: {model: dryden_low_alt, intensity: light}
stack: {autopilot: stock, contingency: classical_v0, estimator: navigator}
