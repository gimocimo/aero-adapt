# The same flight and seed as m1-motorcut-classical, flown by the stock stack (baseline B0):
# no motor-failure logic, so TECS underspeed protection glides it along the mission path.
schema_version: 1
id: m1-motorcut-stock
description: Motor cut at 60 s; stock ArduPlane-equivalent behaviour (baseline B0).
site: cambridge_west
airframe: aerosonde_bm
seed: 1002
duration_s: 300
initial: {pos_ne_m: [0, 0], alt_agl_m: 120, heading_deg: 310, airspeed_mps: 25}
mission:
  alt_agl_m: 120
  waypoints_ne_m: [[500, -600], [500, 400, 140], [-900, 400], [-900, -600]]
  on_complete: loop
environment:
  wind: {from_deg: 250, speed_mps: 6}
  turbulence: {model: dryden_low_alt, intensity: light}
faults:
  - {type: motor_cut, trigger: {at_time_s: 60}}
stack: {autopilot: stock, contingency: none, estimator: navigator}
