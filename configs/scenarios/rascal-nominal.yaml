# The M1 nominal mission flown by the held-out Rascal 110 (M2 spec D4): the stock stack,
# configured and tuned from the Rascal's datasheet (configs/fleets/rascal), on the Rascal's own
# JSBSim model (aeroadapt.sim.jsbsim.rascal). Fly it in JSBSim with tools/rascal_flights.py;
# the scenario runner flies it in aerojax on the datasheet model the stack was tuned on.
schema_version: 1
id: rascal-nominal
description: The held-out Rascal 110 flies the M1 loop around the Coton fields in light turbulence.
site: cambridge_west
fleet: configs/fleets/rascal
airframe: rascal-110
seed: 1001
duration_s: 300
initial: {pos_ne_m: [0, 0], alt_agl_m: 120, heading_deg: 310, airspeed_mps: 14.5}
mission:
  alt_agl_m: 120
  speed_mps: 14.5  # the Rascal's cruise (the default is the Aerosonde's 25)
  waypoints_ne_m: [[500, -600], [500, 400, 140], [-900, 400], [-900, -600]]
  on_complete: loop
environment:
  wind: {from_deg: 250, speed_mps: 6}
  turbulence: {model: dryden_low_alt, intensity: light}
stack: {autopilot: stock, contingency: classical_v0, estimator: navigator, params: configs/fleets/rascal}
