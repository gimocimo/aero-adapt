# Aileron jammed slightly right-wing-down: the rudder and the roll integrator fight it (golden 4).
schema_version: 1
id: m1-servo-jam
description: Aileron jams at +3 deg at 50 s; stock stack.
site: cambridge_west
airframe: aerosonde_bm
seed: 1004
duration_s: 200
initial: {pos_ne_m: [0, 0], alt_agl_m: 120, heading_deg: 310, airspeed_mps: 25}
mission:
  alt_agl_m: 120
  waypoints_ne_m: [[500, -600], [500, 400, 140], [-900, 400], [-900, -600]]
  on_complete: loop
environment:
  wind: {from_deg: 250, speed_mps: 6}
  turbulence: {model: dryden_low_alt, intensity: light}
faults:
  - {type: servo_jam, channel: aileron, trigger: {at_time_s: 50}, jam_position_deg: 3.0}
stack: {autopilot: stock, contingency: classical_v0, estimator: navigator}
