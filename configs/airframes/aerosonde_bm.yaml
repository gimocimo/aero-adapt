schema_version: 1
id: aerosonde_bm
name: Aerosonde (Beard & McLain textbook model)

provenance:
  source: >-
    R. W. Beard and T. W. McLain, "Small Unmanned Aircraft: Theory and Practice",
    Princeton University Press, 2012; propeller/motor model from the addendum by T. W. McLain.
  values_from: byu-magicc/mavsim_public mavsim_python/parameters/aerosonde_parameters.py
  commit: 10363e0eaeb16a61a7463505f8e122a9eb7e2b4e
  notes: >-
    Numerical parameter values only; no code is copied (the repository is GPL-3.0 and its
    dynamics files are student templates). The source also lists linear-drag terms
    (C_D_0 = 0.0424, C_D_alpha = 0.132), a legacy propeller area (S_prop = 0.2027) and a
    density (rho = 1.2682) which belong to other model variants or to the environment and
    are deliberately not part of this airframe. Known limitation: this is a textbook model;
    the stall blending at alpha0 = 0.47 rad (~27 deg) is unrealistically late and the drag
    polar is idealised. It exists in M1 to prove the plumbing and validation methodology.

mass_inertia:
  mass_kg: 11.0
  Jx_kgm2: 0.8244
  Jy_kgm2: 1.135
  Jz_kgm2: 1.759
  Jxz_kgm2: 0.1204

geometry:
  wing_area_m2: 0.55
  span_m: 2.8956
  chord_m: 0.18994
  oswald_e: 0.9

aero:
  longitudinal:
    C_L_0: 0.23
    C_L_alpha: 5.61
    C_L_q: 7.95
    C_L_delta_e: 0.13
    C_D_p: 0.043
    C_D_q: 0.0
    C_D_delta_e: 0.0135
    C_m_0: 0.0135
    C_m_alpha: -2.74
    C_m_q: -38.21
    C_m_delta_e: -0.99
  lateral:
    C_Y_0: 0.0
    C_Y_beta: -0.98
    C_Y_p: 0.0
    C_Y_r: 0.0
    C_Y_delta_a: 0.075
    C_Y_delta_r: 0.19
    C_ell_0: 0.0
    C_ell_beta: -0.13
    C_ell_p: -0.51
    C_ell_r: 0.25
    C_ell_delta_a: 0.17
    C_ell_delta_r: 0.0024
    C_n_0: 0.0
    C_n_beta: 0.073
    C_n_p: 0.069
    C_n_r: -0.095
    C_n_delta_a: -0.011
    C_n_delta_r: -0.069
  stall:
    M: 50.0
    alpha0_rad: 0.47

propulsion:
  prop_diameter_m: 0.508          # 20 in
  C_T: [0.09357, -0.06044, -0.1079]   # [C_T0, C_T1, C_T2], C_T(J) = C_T0 + C_T1 J + C_T2 J^2
  C_Q: [0.005230, 0.004970, -0.01664] # [C_Q0, C_Q1, C_Q2]
  windmill_cd: 0.02               # ours: stopped/windmilling-prop drag on the disc area (to calibrate)
  motor:
    KV_rpm_per_volt: 145.0
    R_ohm: 0.042
    i0_a: 1.5
  battery:
    n_cells: 12
    v_cell_v: 3.7                 # B&M ideal battery: V_max = 3.7 V x n_cells (used for parity)
    # --- ours (realistic battery, spec §6.4) ---
    capacity_ah: 16.0
    r_internal_ohm: 0.048         # pack (4 mOhm per cell)
    avionics_current_a: 1.0
    ocv_curve: [[0.0, 3.30], [0.1, 3.60], [0.2, 3.70], [0.3, 3.74], [0.4, 3.77], [0.5, 3.80],
                [0.6, 3.85], [0.7, 3.90], [0.8, 3.98], [0.9, 4.08], [1.0, 4.20]]  # [SOC, V/cell] LiPo

# ---------------------------------------------------------------------------------------------
# Everything below is ours (not in the textbook): actuator dynamics and the sensor suite (spec
# §6.3, §6.7). M1 defaults; randomised from M2. Signs: commands use aircraft-response semantics
# (aileron +1 = roll right, elevator +1 = nose up, rudder +1 = nose right); the simulator maps
# them to B&M deflection signs from the signs of the primary control derivatives (ADR-001).
actuators:
  # Elevator ±30°: the B&M pitching-moment model needs ~34° of elevator to trim at best glide
  # (α ≈ 13°); with ±25° the aircraft cannot trim below ~18 m/s, leaving no flare authority.
  surfaces:
    aileron:  {max_deflection_deg: 25.0, rate_limit_dps: 300.0, tau_s: 0.02, delay_s: 0.02, deadband_deg: 0.2, trim_deg: 0.0, reversed: false}
    elevator: {max_deflection_deg: 30.0, rate_limit_dps: 300.0, tau_s: 0.02, delay_s: 0.02, deadband_deg: 0.2, trim_deg: 0.0, reversed: false}
    rudder:   {max_deflection_deg: 25.0, rate_limit_dps: 300.0, tau_s: 0.02, delay_s: 0.02, deadband_deg: 0.2, trim_deg: 0.0, reversed: false}
  throttle: {tau_s: 0.05, delay_s: 0.01}

sensors:
  imu:
    rate_hz: 100.0
    gyro_noise_rps: 0.005
    gyro_bias_rw: 1.0e-4          # rad/s/sqrt(s)
    gyro_bias_init_rps: 0.0005    # 1-sigma residual after the boot-time gyro calibration (INS_GYR_CAL)
    accel_noise_mps2: 0.05
    accel_bias_rw: 1.0e-3         # m/s^2/sqrt(s)
    accel_bias_init_mps2: 0.05
  baro: {rate_hz: 20.0, noise_pa: 3.0, drift_rw_pa_per_sqrt_s: 0.0645}   # 0.5 Pa/min random walk
  airspeed: {rate_hz: 20.0, noise_pa: 1.5}
  gnss: {rate_hz: 5.0, latency_s: 0.12, pos_sigma_h_m: 1.0, pos_sigma_v_m: 2.0, pos_tau_s: 300.0, vel_sigma_mps: 0.1}
  mag: {rate_hz: 50.0, noise_gauss: 0.005}
  battery: {rate_hz: 10.0, voltage_noise_v: 0.05, current_noise_a: 0.2}
  esc: {rate_hz: 10.0, rpm_noise_frac: 0.01}
