schema_version: 1
id: cambridge_west
name: Cambridge west fringe — Coton Countryside fields
description: >-
  UK development (and candidate hero) site. A large, flat arable field between Coton village
  (north-west) and the M11 (about 200 m east), with a woodland strip to the north and the West
  Cambridge campus across the motorway to the north-east. Fields to the south. Ground-risk
  features (village, motorway, campus) all lie within 1 km.

origin:
  lat_deg: 52.2075
  lon_deg: 0.0747
  h_ellipsoid_m: 63.9   # WGS84 ellipsoidal ground height at the origin
geoid_undulation_m: 46.0  # approx. (±1 m) EGM/OSGM separation here; used only for ISA/baro reference

ground_model: flat      # M5 replaces this with a DEM
ground_survey:
  method: >-
    Google Photorealistic 3D Tiles surface (scene.sampleHeightMostDetailed) on a 150 m grid
    within ±600 m of the origin, cross-checked against Cesium World Terrain (ion asset 1).
    The 3D-tiles surface over open ground is used because that is the surface the viewer
    renders. In this area Cesium World Terrain sits 1-5 m above it.
  date: 2026-10-14
  origin_tiles_surface_m: 63.92
  origin_terrain_dtm_m: 64.72
  within_300m_surface_m: {min: 63.23, median: 64.4}
  flat_area_note: >-
    Flat to about ±1 m within 300 m of the origin. Trees and buildings in the woodland strip
    to the north stand 5-28 m above the field. The terrain rises 20-50 m towards Madingley
    1-2 km to the west, so M1 safe zones (flat-ground model) must stay in the flat area east
    of Coton.

isa:
  temp_offset_k: 0.0
  qnh_hpa: 1013.25

magnetic:               # tools/site_magnetic.py 52.2075 0.0747 63.9 2026.784
  model: WMM2025
  epoch_year: 2026.784
  declination_deg: 1.229
  inclination_deg: 67.128
  total_field_gauss: 0.49334
  field_ned_gauss: [0.19171, 0.00411, 0.45455]

airspace_notes: >-
  About 7.8 km west of Cambridge City Airport (EGSC) and away from its runway-05/23 extended
  centrelines, so by our estimate outside its flight restriction zone (runway protection zones
  extend 5 km beyond the thresholds). Bourn airfield lies about 8 km west. Simulation only:
  verify on the CAA's official drone airspace map before any real-world use.

# Pre-surveyed ditch zones (classical contingency, spec §9.3). Corners picked on the Google 3D
# Tiles surface in a top-down view (Skyview dev hook, 2026-10-15), converted to local NE metres
# and inset 15 m from the hedges and tree lines. All four lie on the flat ground around the
# origin: interior heights 62-66 m vs the 63.9 m site ground. Fields further west (rising to
# ~97 m) and east of the M11 (~58-61 m) need the M5 terrain model before they can be used.
safe_zones:
  - id: A
    surface: arable (winter crop), 12 ha; the origin field. M11 along the east edge
    quality: 0.9
    polygon_ne_m: [[44.0, -154.8], [-18.4, 91.9], [-392.0, 55.6], [-267.9, -243.5]]
  - id: B
    surface: arable, 4.9 ha; curved western edge (polygon is the inscribed quadrilateral)
    quality: 0.8
    polygon_ne_m: [[72.1, -485.6], [-1.5, -257.5], [-201.2, -296.9], [-84.5, -463.4]]
  - id: C
    surface: arable, 8.5 ha; south of A across a hedge
    quality: 0.8
    polygon_ne_m: [[-352.8, -237.4], [-454.5, 29.6], [-737.4, 3.2], [-627.9, -213.5]]
  - id: F
    surface: grass/arable strip, 6 ha; narrow (about 95-190 m wide)
    quality: 0.7
    polygon_ne_m: [[-298.8, -568.6], [-298.8, -475.3], [-612.9, -356.8], [-608.3, -552.7]]

# Planned missions (Txt2Fly, docs/06 §5). The operating area is the farmland west of the M11.
# No-fly areas come from the OpenStreetMap extract (cambridge_west.osm.json, written by
# tools/fetch_gazetteer.py; © OpenStreetMap contributors, ODbL): the motorway with 50 m either
# side, Coton's built-up area with 30 m around it, and the West Cambridge campus. Simulation
# only: real operations follow the CAA's rules and an operator's own risk assessment.
operations:
  home_ne_m: [-150.0, -200.0]  # over field A, so the RTL circle stays clear of the M11
  geofence_ne_m: [[800.0, -1300.0], [800.0, 300.0], [-1300.0, 300.0], [-1300.0, -1300.0]]
  ceiling_agl_m: 120.0  # the UK open category's maximum height
  min_agl_m: 40.0
  fence_alt_margin_m: 20.0
  no_fly:
    - id: m11
      name: M11 motorway
      reason: motorway traffic below
      osm_area: motorway-m11
    - id: coton
      name: Coton village
      reason: houses and people below
      osm_area: settlement-coton
    - id: coton-north
      name: houses on Madingley Road
      reason: houses and people below
      osm_area: settlement-coton-2
    - id: west-cambridge
      name: West Cambridge campus
      reason: buildings and people below
      osm_area: campus-cambridge-west
  places:
    - id: home
      name: home
      kind: home
      point_ne_m: [-150.0, -200.0]
      aliases: [launch point, base]
