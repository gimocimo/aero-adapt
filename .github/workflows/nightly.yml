name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  full-validation:
    name: full validation tier
    runs-on: ubuntu-latest
    timeout-minutes: 90 # 53 min on 24 Oct 2026; the map-aware planner's tests took it past 60
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  validation-report:
    name: validation report (artefact)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras
      - run: uv run python -m validation.report --out validation-report
      - uses: actions/upload-artifact@v7
        with:
          name: m1-validation-report
          path: validation-report/
