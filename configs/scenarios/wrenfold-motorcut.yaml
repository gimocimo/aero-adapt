# Wrenfold Vale (docs/07): a motor cut on a circuit of the valley. The classical contingency
# glides to one of the world's surveyed landing grounds, over real hedges and trees.
schema_version: 1
id: wrenfold-motorcut
description: >-
  Wrenfold Vale: motor cut at 60 s on a circuit of the valley; the classical contingency
  picks a surveyed field and lands over its hedges.
site: wrenfold_vale
airframe: aerosonde_bm
seed: 3001
duration_s: 400
initial: {pos_ne_m: [0, 0], alt_agl_m: 110, heading_deg: 90, airspeed_mps: 25}
mission:
  alt_agl_m: 110
  waypoints_ne_m: [[0, 1100], [-600, 1100], [-650, -900], [100, -1200]]
  on_complete: loop
environment:
  wind: {from_deg: 250, speed_mps: 6}
  turbulence: {model: dryden_low_alt, intensity: light}
faults:
  - {type: motor_cut, trigger: {at_time_s: 60}}
stack: {autopilot: stock, contingency: classical_v0, estimator: navigator}
